site_name: akef-cards
site_url: https://shresthvaibhav.github.io/akef-cards/
site_description: Image cards for Arknights Endfield, from an Enka UID or a SKPORT account
repo_url: https://github.com/ShresthVaibhav/akef-cards
repo_name: ShresthVaibhav/akef-cards
edit_uri: edit/main/docs/
copyright: MIT licensed. Not affiliated with Hypergryph or Gryphline.

exclude_docs: |
  README.md

theme:
  name: material
  font:
    text: Barlow
    code: JetBrains Mono
  icon:
    logo: material/cards-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/extra.css

plugins:
  - search
  - glightbox:
      zoomable: true
      skip_classes:
        - no-zoom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ShresthVaibhav/akef-cards
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/akef-cards/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Cards:
      - cards/index.md
      - Operator: cards/operator.md
      - Animated operator: cards/animated.md
      - Compare: cards/compare.md
      - Profile: cards/profile.md
      - Live status: cards/live.md
      - Roster: cards/roster.md
      - Factory: cards/factory.md
      - Exploration: cards/exploration.md
      - Pull history: cards/pulls.md
      - Monument: cards/monument.md
      - Contingency Contract: cards/contract.md
      - Wiki: cards/wiki.md
  - Guides:
      - Custom art: custom-art.md
      - Using it in a bot: bots.md
      - Caching and game data: caching.md
  - Reference:
      - API reference: reference.md
      - Data: data.md
      - Errors: errors.md
